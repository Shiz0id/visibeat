<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background - deep forest -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152E20"/>
      <stop offset="40%" stop-color="#1E3D2C"/>
      <stop offset="100%" stop-color="#2B5438"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4A9A65" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#152E20" stop-opacity="0"/>
    </radialGradient>

    <!-- Left side face gradient - the thick metallic/glossy side (like Longhorn's gold, but green) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#8FD4A4" stop-opacity="0.95"/>
      <stop offset="15%" stop-color="#6BBF82" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#4A9A65" stop-opacity="0.88"/>
      <stop offset="85%" stop-color="#367A4C" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#285A38" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Top face gradient - slightly lit from above -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ACC95" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5AAF75" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3D8A55" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Front face glass -->
    <linearGradient id="frontFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D0F0DD" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Front face specular gloss (Longhorn bright band) -->
    <linearGradient id="gloss" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Front face border highlight -->
    <linearGradient id="frontBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Left side edge highlight (bright leading edge like Longhorn) -->
    <linearGradient id="leftEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8F0D5" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#8FD4A4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4A9A65" stop-opacity="0"/>
    </linearGradient>

    <!-- Beat bar gradient -->
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B8E8C8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#8BC9A0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Spine glow -->
    <linearGradient id="spGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BC9A0" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8BC9A0" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#B8E8C8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#8BC9A0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8BC9A0" stop-opacity="0"/>
    </linearGradient>

    <!-- Icon border -->
    <linearGradient id="iconBdr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="5" dy="12" stdDeviation="18" flood-color="#050F0A" flood-opacity="0.55"/>
    </filter>
    <filter id="spBlur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bGlow"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="reflBlur"><feGaussianBlur stdDeviation="3"/></filter>

    <clipPath id="iClip">
      <rect x="0" y="0" width="512" height="512" rx="108" ry="108"/>
    </clipPath>

    <!-- Clip for front face content -->
    <clipPath id="fClip">
      <path d="M 218,108 L 400,136 L 400,340 Q 400,356 386,358 L 218,330 Q 204,328 204,312 L 204,122 Q 204,108 218,108 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iClip)">

    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Ambient light streaks -->
    <line x1="-40" y1="340" x2="550" y2="130" stroke="#6BBF82" stroke-opacity="0.025" stroke-width="120"/>

    <!-- === TIMELINE SPINE (left side) === -->
    <rect x="73" y="50" width="7" height="412" rx="3.5" fill="url(#spGlow)" filter="url(#spBlur)"/>

    <line x1="76.5" y1="68" x2="76.5" y2="88" stroke="#B8E8C8" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="100" x2="76.5" y2="120" stroke="#B8E8C8" stroke-opacity="0.35" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="132" x2="76.5" y2="152" stroke="#B8E8C8" stroke-opacity="0.28" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="164" x2="76.5" y2="184" stroke="#B8E8C8" stroke-opacity="0.32" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="196" x2="76.5" y2="216" stroke="#B8E8C8" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="228" x2="76.5" y2="248" stroke="#B8E8C8" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="260" x2="76.5" y2="280" stroke="#B8E8C8" stroke-opacity="0.38" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="292" x2="76.5" y2="312" stroke="#B8E8C8" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="324" x2="76.5" y2="344" stroke="#B8E8C8" stroke-opacity="0.25" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="356" x2="76.5" y2="376" stroke="#B8E8C8" stroke-opacity="0.18" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="388" x2="76.5" y2="408" stroke="#B8E8C8" stroke-opacity="0.12" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="76.5" y1="420" x2="76.5" y2="440" stroke="#B8E8C8" stroke-opacity="0.08" stroke-width="2.2" stroke-linecap="round"/>

    <circle cx="76.5" cy="152" r="4" fill="#B8E8C8" fill-opacity="0.45"/>
    <circle cx="76.5" cy="248" r="5" fill="#B8E8C8" fill-opacity="0.55"/>
    <circle cx="76.5" cy="344" r="4" fill="#B8E8C8" fill-opacity="0.4"/>

    <!-- Small glass card hint on spine -->
    <g transform="translate(30, 94)">
      <rect width="56" height="56" rx="9" fill="white" fill-opacity="0.055"/>
      <rect width="56" height="56" rx="9" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="0.7"/>
    </g>
    <g transform="translate(42, 298)">
      <rect width="44" height="44" rx="7" fill="white" fill-opacity="0.04"/>
      <rect width="44" height="44" rx="7" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="0.6"/>
    </g>

    <!-- === 3D ALBUM CUBE === -->
    <!--
      Proper connected 3D form. The cube is rotated ~30° on Y axis showing:
      - LEFT side face (prominent, thick, the Longhorn signature)
      - FRONT face (album art / glass with visualizer)
      - TOP face (thin sliver, lit from above)
      All faces share edges — drawn as connected paths.

      Cube vertices (approximate isometric projection):
      Back-top-left:     130, 100
      Back-top-right:    400, 128
      Back-bottom-left:  130, 322
      Back-bottom-right: 400, 350
      Front-top-left:    200, 112
      Front-top-right:   400, 128  (shared with back-top-right)
      Front-bottom-left: 200, 334
      Front-bottom-right:400, 350  (shared with back-bottom-right)

      Simplified for cleaner geometry:
    -->
    <g filter="url(#shadow)">

      <!-- TOP FACE (thin sliver visible) -->
      <path d="
        M 160,112
        C 160,106 165,104 170,104
        L 375,90
        C 382,89 390,92 392,97
        L 392,102
        L 385,130
        C 384,132 380,133 376,134
        L 170,118
        C 164,117 160,116 160,112
        Z
      " fill="url(#topFace)"/>

      <!-- LEFT SIDE FACE (the chunky Longhorn face) -->
      <path d="
        M 160,112
        C 160,106 165,104 170,104
        L 170,104
        L 160,112
        L 160,330
        C 160,338 164,340 170,340
        L 170,340
        L 170,118
        C 164,117 160,116 160,112
        Z
      " fill="url(#leftFace)" opacity="0"/>

      <!-- LEFT SIDE — as a proper visible thick face -->
      <path d="
        M 148,118
        C 148,108 154,102 162,100
        L 198,108
        C 194,108 190,112 190,118
        L 190,328
        C 190,336 192,338 198,340
        L 162,332
        C 154,330 148,326 148,318
        Z
      " fill="url(#leftFace)"/>

      <!-- Left side leading-edge bright highlight (Longhorn metallic edge catch) -->
      <path d="
        M 148,118
        C 148,108 154,102 162,100
        L 155,102
        C 150,106 148,110 148,118
        L 148,318
        C 148,324 150,328 155,330
        L 162,332
        C 154,330 148,326 148,318
        Z
      " fill="url(#leftEdge)"/>

      <!-- FRONT FACE (glass + visualizer) -->
      <path d="
        M 190,118
        C 190,110 196,106 204,108
        L 396,136
        C 404,137 408,143 408,150
        L 408,340
        C 408,350 404,354 396,354
        L 204,326
        C 196,325 190,320 190,312
        Z
      " fill="url(#frontFace)"/>

      <!-- Front face border -->
      <path d="
        M 190,118
        C 190,110 196,106 204,108
        L 396,136
        C 404,137 408,143 408,150
        L 408,340
        C 408,350 404,354 396,354
        L 204,326
        C 196,325 190,320 190,312
        Z
      " fill="none" stroke="url(#frontBorder)" stroke-width="1.8"/>

      <!-- Front face specular gloss -->
      <clipPath id="fc2">
        <path d="
          M 190,118 C 190,110 196,106 204,108
          L 396,136 C 404,137 408,143 408,150
          L 408,340 C 408,350 404,354 396,354
          L 204,326 C 196,325 190,320 190,312 Z
        "/>
      </clipPath>
      <g clip-path="url(#fc2)">
        <!-- Upper gloss band -->
        <path d="
          M 190,118 L 408,150 L 408,210 L 190,178 Z
        " fill="url(#gloss)"/>

        <!-- Diagonal light sweep -->
        <line x1="170" y1="240" x2="430" y2="160" stroke="white" stroke-opacity="0.05" stroke-width="50"/>

        <!-- === BEAT BARS === -->
        <!-- Bar glow layer -->
        <g filter="url(#bGlow)" opacity="0.35">
          <rect x="210" y="180" width="14" height="60" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="232" y="164" width="14" height="76" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="254" y="150" width="14" height="90" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="276" y="172" width="14" height="68" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="298" y="156" width="14" height="84" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="320" y="144" width="14" height="96" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="342" y="176" width="14" height="64" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
          <rect x="364" y="188" width="14" height="52" rx="4" fill="#8BC9A0" transform="skewY(4)"/>
        </g>

        <!-- Sharp bars -->
        <g>
          <rect x="210" y="182" width="13" height="56" rx="3.5" fill="url(#bar)" opacity="0.5" transform="skewY(4)"/>
          <rect x="232" y="166" width="13" height="72" rx="3.5" fill="url(#bar)" opacity="0.6" transform="skewY(4)"/>
          <rect x="254" y="152" width="13" height="86" rx="3.5" fill="url(#bar)" opacity="0.7" transform="skewY(4)"/>
          <rect x="276" y="174" width="13" height="64" rx="3.5" fill="url(#bar)" opacity="0.55" transform="skewY(4)"/>
          <rect x="298" y="158" width="13" height="80" rx="3.5" fill="url(#bar)" opacity="0.65" transform="skewY(4)"/>
          <rect x="320" y="146" width="13" height="92" rx="3.5" fill="url(#bar)" opacity="0.75" transform="skewY(4)"/>
          <rect x="342" y="178" width="13" height="60" rx="3.5" fill="url(#bar)" opacity="0.5" transform="skewY(4)"/>
          <rect x="364" y="190" width="13" height="48" rx="3.5" fill="url(#bar)" opacity="0.4" transform="skewY(4)"/>
        </g>
      </g>

      <!-- Inner edge glow on front face -->
      <path d="
        M 194,122 C 194,114 198,111 206,112
        L 394,139 C 400,140 404,145 404,150
        L 404,338 C 404,346 400,350 394,350
        L 206,323 C 198,322 194,318 194,310 Z
      " fill="none" stroke="#B8E8C8" stroke-opacity="0.06" stroke-width="1"/>

    </g>

    <!-- === REFLECTION (below cube) === -->
    <g transform="translate(0, 20)" opacity="0.1" filter="url(#reflBlur)">
      <path d="
        M 190,358
        C 190,356 196,354 204,354
        L 396,370
        C 404,371 408,374 408,378
        L 408,410
        C 408,414 404,416 396,416
        L 204,400
        C 196,399 190,396 190,392
        Z
      " fill="white" fill-opacity="0.2"/>
    </g>

    <!-- Outer icon border -->
    <rect x="0" y="0" width="512" height="512" rx="108" ry="108"
          fill="none" stroke="url(#iconBdr)" stroke-width="2"/>

  </g>
</svg>
